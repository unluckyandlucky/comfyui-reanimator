# Los tests de seguridad del bridge, en el repo publico del nodo.
#
# Este fichero solo hace algo DESPUES de sincronizar la carpeta a su propio
# repositorio (tools/sync-node-repo.ps1): GitHub unicamente lee .github/ en la
# raiz del repo, y aqui dentro del monorepo esta carpeta es inerte.
name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 es el minimo que declara pyproject; 3.12 es lo que trae ComfyUI
        # Desktop hoy. Si una de las dos se rompe, se rompe en una maquina de
        # usuario real.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # aiohttp lo pone ComfyUI, por eso no esta en pyproject. Aqui no hay
      # ComfyUI, asi que el runner lo instala a mano.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install cryptography Pillow aiohttp
      - run: python -m unittest discover -s tests -v
